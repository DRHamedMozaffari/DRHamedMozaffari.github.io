# ============================================================
# STEP 1: Your Identity (required)
# ============================================================
name: "M. Hamed Mozaffari"
title: "Research Officer"

# ============================================================
# Lab identity — used for the site branding (navbar, browser tab,
# footer). Leave `lab_name` empty to brand the site with your own
# name instead.
# ============================================================
lab_name: "TERAVIS Team"
lab_full: "Twins & XR · Energy · Robotics · AI · Vision · IoT & cloud · Sensing"
lab_tagline: "Turning visual, spatial and sensor data into insight for a smarter, greener built environment."
lab_initials: ""   # not used any more — the navbar / browser-tab icon is the logo in favicon.svg

# What each letter of the team name stands for (shown under the name on the
# home page). If the team name changes, update this list to match.
lab_letters:
  - letter: "T"
    word: "Twins & XR"
    detail: "Digital twins, BIM, extended reality"
  - letter: "E"
    word: "Energy"
    detail: "Green electrical energy"
  - letter: "R"
    word: "Robotics"
    detail: "Robotics & automation"
  - letter: "A"
    word: "AI"
    detail: "Artificial intelligence, LLMs, VLMs"
  - letter: "V"
    word: "Vision"
    detail: "Computer vision"
  - letter: "I"
    word: "IoT & cloud"
    detail: "IIoT, AIoT, smart homes, cloud & data"
  - letter: "S"
    word: "Sensing"
    detail: "Satellite, LiDAR, thermography, microscopy, Scan2BIM"
hide_sidebar_profile: true   # true = no PI card in the home page sidebar
hide_news: true              # true = no News list in the home-page sidebar (the News tab still works)

institution: "National Research Council Canada / Conseil national de recherches Canada"
email: MHamed.MozaffariMaaref@nrc-cnrc.gc.ca
photo: Hamed.jpeg  # place your photo in images/

# ============================================================
# STEP 2: Your Links (optional -- leave blank to hide an icon)
# ============================================================
links:
  google_scholar: "https://scholar.google.com/citations?user=tu-iT7AAAAAJ&hl=en"
  github: "https://github.com/Hamed-Mozaffari"
  researchgate: "https://www.researchgate.net/profile/Mohammad_Hamed_Mozaffari"
  NRC: "https://nrc.canada.ca/en/corporate/contact-us/nrc-directory-science-professionals/hamed-mozaffari-maaref"
  twitter: ""
  linkedin: "https://www.linkedin.com/in/hamed-mozaffari"
  cv: ""  # e.g., "papers/cv.pdf"

# ============================================================
# STEP 3: Site Settings
# ============================================================
accent_color: "#15803d"      # theme color (green); light and dark variants are derived automatically
dark_mode: false             # white & green theme only (set to true to bring back the dark-mode button)
math: false                  # true loads MathJax on every page; or add `math: true` to individual pages
description: "TERAVIS Team — a research collaboration in artificial intelligence, computer vision, remote sensing, robotics, IoT, green energy and digital twins for the built environment."

# When deploying with the included GitHub Actions workflow these are filled
# in automatically from your Pages settings (user site, project site, or
# custom domain). Set them only if you host the site somewhere else.
url: ""
baseurl: ""

# Analytics -- fill in whichever service you use; leave the rest blank.
analytics:
  google_id: ""          # Google Analytics 4 measurement ID, e.g. G-XXXXXXXXXX
  plausible_domain: ""   # Plausible: your site's domain, e.g. jsmith.github.io
  umami_website_id: ""   # Umami: website ID (and umami_src if self-hosted)
  umami_src: ""          #   default https://cloud.umami.is/script.js
  goatcounter: ""        # GoatCounter: your code, e.g. jsmith (for jsmith.goatcounter.com)

# ============================================================
# Team member profile pages (_people/)
# ============================================================
# Every file in _people/ becomes its own page at /team/<file-name>/
# (e.g. _people/hamed-mozaffari.md  ->  /team/hamed-mozaffari/).
# The Team page builds its cards from these files automatically.
collections:
  people:
    output: true
    permalink: /team/:name/

# ============================================================
# STEP 4: Choose Your Pages (comment out any you don't need)
# ============================================================
# Each name is a page in _pages/. Add `label: Papers` to change the
# navbar text without changing the URL.
nav_pages:
  - name: research
  - name: project
    label: Projects
  - name: development
  - name: team
  - name: teaching
    label: Community in touch
  - name: news
  - name: publications
  - name: about
 # - name: blog

# ============================================================
# STEP 5: Publications (assets/ref.bib)
# ============================================================
# Your name is bolded in the publication list. Write it exactly as it
# appears in the rendered list ("Last, F. M."); list the longest form first.
scholar:
  last_name: Mozaffari
  first_name: ["M. Hamed", "Mohammad Hamed", "Hamed", "M."]
  style: citesty
  locale: en
  source: /assets/
  bibliography: ref.bib
  bibliography_template: bibtemplate
  sort_by: year, month
  order: descending
  replace_strings: true
  join_strings: true
  query: "@*"
  bibliography_list_attributes:
    reversed: "reversed"
  # Template-only fields, kept out of the copyable BibTeX
  bibtex_skip_fields: [abstract, month_numeric, file, selected, code, slides, video, poster, data]

# ============================================================
# Advanced Settings (you probably don't need to change these)
# ============================================================
permalink: /blog/:year/:title/

include:
  - _pages

sass:
  style: compressed
  quiet_deps: true                # hide warnings from vendored Bootstrap SCSS
  silence_deprecations: [import]  # Bootstrap 5.3 still uses @import
  sourcemap: development          # no .map file in production builds

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true

plugins: ["jekyll/scholar", "jekyll-sitemap"]

# Repository files that should not be published to the site
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - UPGRADING.md
  - LICENSE
  - setup.sh
  - images/screenshots
  - vendor
  - .bundle
  - node_modules
